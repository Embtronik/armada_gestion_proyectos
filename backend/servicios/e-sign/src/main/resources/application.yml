server:
  port: ${SERVER_PORT:8082}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/proyectos}
    username: ${SPRING_DATASOURCE_USERNAME:proyectos_user}
    password: ${SPRING_DATASOURCE_PASSWORD:Arm@d@2025}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: true
      hibernate.jdbc.time_zone: UTC
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin123}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak-dev:8080/realms/proyectos}

esign:
  ttl-minutes: ${ESIGN_TTL_MINUTES:10}
  exchange: esign.exchange
  routing-generate: esign.generate
  queue-generate: esign.generate.queue

notifications:
  base-url: ${NOTIFICACIONES_BASE_URL:http://notificaciones:8092}
  path: /api/notificaciones
  connect-timeout-ms: 3000
  read-timeout-ms: 5000
