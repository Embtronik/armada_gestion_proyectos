spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/proyectos}
    username: ${SPRING_DATASOURCE_USERNAME:proyectos_user}
    password: ${SPRING_DATASOURCE_PASSWORD:Arm@d@2025}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect # Añade esta línea
    properties:
      hibernate:
        default_schema: public
        hbm2ddl:
          auto: update
        format_sql: true
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin123}
    connection-timeout: 5000
    template:
      retry:
        enabled: true
        initial-interval: 2000ms
        max-interval: 5000ms
        max-attempts: 3
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3

documentos:
  path-nfs: ${DOCUMENTOS_PATH_NFS:C:\mnt\nfs\documentos}

server:
  port: 8081